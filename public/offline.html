<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#26358f">
    <title>SAPA RSBM - Offline</title>
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f9fc;color:#182033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(430px,100%);padding:28px;border:1px solid #e3e8ef;border-radius:22px;background:#fff;box-shadow:0 20px 50px rgba(38,53,143,.1);text-align:center}.icon{display:grid;width:58px;height:58px;margin:0 auto 16px;place-items:center;border-radius:18px;background:#eef1ff;color:#26358f;font-size:28px;font-weight:900}h1{margin:0;font-size:22px}p{margin:10px 0 0;color:#64748b;font-size:14px;line-height:1.6}button{margin-top:18px;padding:11px 18px;border:0;border-radius:12px;background:#26358f;color:#fff;font-weight:800;cursor:pointer}
    </style>
</head>
<body>
    <main class="card">
        <div class="icon">+</div>
        <h1>Koneksi internet tidak tersedia</h1>
        <p>SAPA RSBM memerlukan koneksi internet untuk mengakses data dan layanan pasien secara aman.</p>
        <button type="button" onclick="window.location.reload()">Coba Lagi</button>
    </main>
</body>
</html>
